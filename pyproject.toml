[project]
name = "zenkai"
version = "0.1.0"
description = "AI-assisted classical German literature reader with voice, inline annotation, spaced-repetition vocabulary, and literary context."
readme = "CLAUDE.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "duckdb>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "spacy>=3.7,<4.0",
    "ebooklib>=0.18,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
]
voice = [
    "faster-whisper>=1.0,<2.0",
    "soundfile>=0.12,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py311"]
